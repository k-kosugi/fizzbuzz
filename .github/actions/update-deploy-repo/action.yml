name: Update image digest in the deploy repository
description: >-
  配備用リポジトリの clusters/<環境名>/kustomization.yaml にある、指定したイメージの digest を書き換えて main にコミットする。
  Flux がそのコミットを検知して、クラスターに反映する。
  書き込みには GitHub App のトークン (有効期限 1 時間、配備用リポジトリだけ、contents の書き込みだけ) を使う。

inputs:
  deploy-repository:
    description: 配備用リポジトリの名前 (owner は、このワークフローのリポジトリと同じ)
    required: true
  app-client-id:
    description: 配備用リポジトリに書き込める GitHub App の Client ID
    required: true
  app-private-key:
    description: 上記 GitHub App の秘密鍵
    required: true
  environment:
    description: 環境名。clusters/<環境名>/kustomization.yaml を更新する
    required: true
  image-name:
    description: kustomization.yaml の images にあるイメージ名 (例 fizzbuzz-backend)
    required: true
  digest:
    description: 配備するイメージの digest (sha256:...)
    required: true

runs:
  using: composite
  steps:
    # 配備用リポジトリ 1 つ、contents の書き込みだけに絞った、短命のトークンを発行する。
    # トークンは、このアクションの終了時に自動で失効する
    - name: Create a token for the deploy repository
      id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ inputs.deploy-repository }}
        permission-contents: write

    - name: Update digest and push
      shell: bash
      env:
        DEPLOY_REPO: ${{ github.repository_owner }}/${{ inputs.deploy-repository }}
        TOKEN: ${{ steps.token.outputs.token }}
        APP_SLUG: ${{ steps.token.outputs.app-slug }}
        ENVIRONMENT: ${{ inputs.environment }}
        IMAGE_NAME: ${{ inputs.image-name }}
        DIGEST: ${{ inputs.digest }}
        SOURCE_REPO: ${{ github.repository }}
        SOURCE_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        WORK="$RUNNER_TEMP/deploy"
        trap 'rm -rf "$WORK"' EXIT

        # トークンは URL ではなく HTTP ヘッダーで渡す (ログやリモート設定に残さない)
        AUTH="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
        echo "::add-mask::$AUTH"
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH}"

        git clone --quiet --depth 1 "https://github.com/${DEPLOY_REPO}.git" "$WORK"
        cd "$WORK"
        # コミットの作成者は、この GitHub App 自身にする (履歴から、どの App が更新したか分かる)
        BOT_ID="$(curl -fsS "https://api.github.com/users/${APP_SLUG}%5Bbot%5D" | jq -r .id)"
        git config user.name "${APP_SLUG}[bot]"
        git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

        FILE="clusters/${ENVIRONMENT}/kustomization.yaml"
        SHORT="${DIGEST:0:19}"

        # 同時に別のワークフロー (backend と frontend) が更新すると push が競合するため、最新を取り直して再適用する
        for attempt in 1 2 3 4 5; do
          result="$(python3 "$GITHUB_ACTION_PATH/update-image-digest.py" "$FILE" "$IMAGE_NAME" "$DIGEST")"
          if [ "$result" = "unchanged" ]; then
            echo "Already up to date: ${IMAGE_NAME} ${DIGEST}"
            exit 0
          fi

          git add "$FILE"
          git commit --quiet -m "${ENVIRONMENT}: update ${IMAGE_NAME} to ${SHORT}..." \
            -m "Source: https://github.com/${SOURCE_REPO}/commit/${SOURCE_SHA}" \
            -m "Digest: ${DIGEST}"

          if git push --quiet origin HEAD:main; then
            echo "Updated ${FILE}: ${IMAGE_NAME} -> ${DIGEST}"
            {
              echo "### Deployment manifest updated"
              echo ""
              echo "- repository: \`${DEPLOY_REPO}\`"
              echo "- file: \`${FILE}\`"
              echo "- image: \`${IMAGE_NAME}\`"
              echo "- digest: \`${DIGEST}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "push rejected (attempt ${attempt}); fetching the latest and retrying"
          git fetch --quiet --depth 1 origin main
          git reset --quiet --hard FETCH_HEAD
          sleep $((attempt * 2))
        done

        echo "failed to push after retries" >&2
        exit 1

name: backend-ci

on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml
      - .github/actions/update-deploy-repo/**
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml
      - .github/actions/update-deploy-repo/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: microsoft
          java-version: '25'
          cache: maven

      # 単体テスト (*Test) と結合テスト (*IT) の両方を実行する
      - name: Verify
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  image:
    name: Build, scan and push image
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      # ACR に push したイメージの digest。配備用リポジトリの更新に使う (main への push のときだけ設定される)
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      # Azure への OIDC ログイン (push のときだけ使う) に必要
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          push: false
          tags: fizzbuzz-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fizzbuzz-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # 以降は main ブランチへの push のときだけ実行する (PR はスキャンまで)。
      # スキャンに成功したイメージと同一のものを push する
      - name: Log in to Azure
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_BUILD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push image to ACR
        id: push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          IMAGE="${ACR_NAME}.azurecr.io/fizzbuzz-backend:${GITHUB_SHA}"
          docker tag fizzbuzz-backend:ci "$IMAGE"
          docker push "$IMAGE"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"
          echo "digest=${DIGEST#*@}" >> "$GITHUB_OUTPUT"
          {
            echo "### backend image"
            echo '```'
            echo "$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # staging の配備用マニフェストを、push したイメージの digest に更新する。
  # 更新後は、AKS 上の Flux が配備用リポジトリの変更を検知して、クラスターに反映する
  deploy-staging:
    name: Update staging manifests
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - uses: ./.github/actions/update-deploy-repo
        with:
          deploy-repository: ${{ github.repository_owner }}/fizzbuzz-deploy
          ssh-key: ${{ secrets.DEPLOY_REPO_SSH_KEY }}
          environment: staging
          image-name: fizzbuzz-backend
          digest: ${{ needs.image.outputs.digest }}
